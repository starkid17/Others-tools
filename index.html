<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Digit Match Analyzer</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            padding: 16px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 540px;
            width: 100%;
            margin: 0 auto;
        }
        h2 {
            color: #3b82f6;
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        .card {
            background: #131b2e;
            padding: 18px 16px 20px;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid #1e293b;
            box-shadow: 0 8px 16px -6px rgba(0,0,0,0.5);
        }
        label {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        select {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: 0.2s;
        }
        select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px 8px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            font-size: 15px;
            transition: all 0.15s ease;
            letter-spacing: 0.3px;
        }
        .btn-start {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 8px rgba(16,185,129,0.2);
        }
        .btn-start:hover { background: #059669; transform: scale(1.01); }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-stop {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 8px rgba(239,68,68,0.2);
        }
        .btn-stop:hover { background: #dc2626; transform: scale(1.01); }
        .btn-stop:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .log-box {
            background: #070a12;
            padding: 12px 14px;
            font-family: 'Menlo', 'Cascadia Code', monospace;
            font-size: 11px;
            height: 160px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #1e293b;
            color: #7dd3fc;
            line-height: 1.6;
            scroll-behavior: smooth;
        }
        .log-box::-webkit-scrollbar { width: 4px; }
        .log-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
        .signal-box {
            background: #0f1a2f;
            border-left: 5px solid #3b82f6;
            padding: 16px 16px 14px;
            margin-top: 16px;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px #1e293b;
        }
        .accuracy {
            font-size: 20px;
            color: #fbbf24;
            font-weight: 700;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #334155;
            color: #f1f5f9;
            letter-spacing: 0.3px;
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .target-digit {
            font-size: 28px;
            font-weight: 700;
            color: #10b981;
            letter-spacing: 1px;
            background: #0b1a1a;
            padding: 2px 14px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #1e3a3a;
        }
        .hit-rate {
            color: #94a3b8;
            font-size: 14px;
        }
        .text-muted {
            color: #94a3b8;
            font-size: 13px;
        }
        .mt-1 { margin-top: 8px; }
        .mb-1 { margin-bottom: 6px; }
        .gap-2 { gap: 8px; }
        .flex { display: flex; align-items: center; }
        .flex-wrap { flex-wrap: wrap; }
        .signal-hidden { display: none; }
        .badge-idle { background: #475569; }
        .badge-live { background: #10b981; }
        .badge-error { background: #ef4444; }
        .error-text { color: #ef4444; }
        .success-text { color: #10b981; }
        .log-error { color: #f87171; }
        .log-success { color: #34d399; }
        .log-info { color: #60a5fa; }
    </style>
</head>
<body>
<div class="container">

    <h2>⚡ DIGIT MATCH TERMINAL</h2>

    <div class="card">
        <label>📊 Volatility Market</label>
        <select id="symbol">
            <optgroup label="Standard Volatility Indices">
                <option value="R_10">Volatility 10 Index</option>
                <option value="R_25">Volatility 25 Index</option>
                <option value="R_50">Volatility 50 Index</option>
                <option value="R_75">Volatility 75 Index</option>
                <option value="R_100">Volatility 100 Index</option>
            </optgroup>
            <optgroup label="1-Second Volatility Indices">
                <option value="1HZ10V">1-Second Volatility 10</option>
                <option value="1HZ25V">1-Second Volatility 25</option>
                <option value="1HZ50V">1-Second Volatility 50</option>
                <option value="1HZ75V" selected>1-Second Volatility 75</option>
                <option value="1HZ100V">1-Second Volatility 100</option>
            </optgroup>
            <optgroup label="Step Indices">
                <option value="STEP_50">Step 50 Index</option>
                <option value="STEP_100">Step 100 Index</option>
                <option value="STEP_200">Step 200 Index</option>
            </optgroup>
            <optgroup label="Crash/Boom">
                <option value="CRASH_100">Crash 100 Index</option>
                <option value="BOOM_100">Boom 100 Index</option>
            </optgroup>
        </select>

        <div class="btn-group">
            <button class="btn-start" id="startBtn" onclick="startAnalysis()">▶ Run Analysis</button>
            <button class="btn-stop" id="stopBtn" onclick="stopAnalysis()">⏹ Stop</button>
        </div>
    </div>

    <div class="card">
        <div class="flex-row">
            <span><span class="status-badge" id="statusBadge">Idle</span> <span id="statusText" class="text-muted" style="margin-left: 6px;">Ready</span></span>
            <span id="bufferInfo" class="text-muted" style="font-size: 12px;">buffer: 0/100</span>
        </div>

        <div id="signalDisplay" class="signal-box signal-hidden">
            <div class="flex flex-wrap gap-2" style="justify-content: space-between;">
                <span style="font-weight: 500;">🎯 Predicted Digit</span>
                <span class="target-digit" id="targetDigit">—</span>
            </div>
            <div class="flex flex-wrap gap-2" style="justify-content: space-between; margin-top: 8px;">
                <span style="font-weight: 500;">📈 Confidence</span>
                <span class="accuracy" id="accuracyScore">—%</span>
            </div>
            <div class="flex flex-wrap gap-2" style="justify-content: space-between; margin-top: 6px; border-top: 1px solid #1e293b; padding-top: 8px;">
                <span class="hit-rate" id="hitRateDisplay">Hit rate: —</span>
                <span style="color: #94a3b8; font-size: 13px;" id="sampleStatus">buffer: 0/100</span>
            </div>
        </div>

        <div style="margin-top: 16px;">
            <div class="log-box" id="logBox">[System] Terminal ready · Select market & run</div>
        </div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- DOM refs -----
        const logBox = document.getElementById('logBox');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const signalDisplay = document.getElementById('signalDisplay');
        const targetDigitEl = document.getElementById('targetDigit');
        const accuracyScoreEl = document.getElementById('accuracyScore');
        const hitRateDisplay = document.getElementById('hitRateDisplay');
        const sampleStatus = document.getElementById('sampleStatus');
        const bufferInfo = document.getElementById('bufferInfo');
        const symbolSelect = document.getElementById('symbol');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // ----- state -----
        let ws = null;
        let recentDigits = [];
        const SAMPLE_SIZE = 100;
        let isAnalyzing = false;
        let pingTimer = null;
        let reconnectTimer = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 10;
        let isSubscribed = false;
        let lastTickTime = 0;

        // ----- helpers -----
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const emoji = type === 'error' ? '✖' : type === 'success' ? '✔' : '▶';
            const cls = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : 'log-info';
            logBox.innerHTML += `<div class="${cls}">[${time}] ${emoji} ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
            if (logBox.children.length > 200) {
                const items = logBox.innerHTML.split('</div>');
                logBox.innerHTML = items.slice(-120).join('</div>');
            }
        }

        function updateUI(hotDigit, percentage, count) {
            if (signalDisplay.classList.contains('signal-hidden')) {
                signalDisplay.classList.remove('signal-hidden');
            }
            targetDigitEl.innerText = hotDigit !== undefined ? ` ${hotDigit} ` : '—';
            const acc = (percentage !== undefined) ? Math.min(96, Math.max(48, 52 + ((percentage - 10) * 3.2))).toFixed(1) : '—';
            accuracyScoreEl.innerText = (percentage !== undefined) ? `${acc}%` : '—%';
            hitRateDisplay.innerText = (percentage !== undefined) ? `Hit rate: ${percentage.toFixed(1)}%` : 'Hit rate: —';
            const bufferLen = recentDigits.length;
            sampleStatus.innerText = `buffer: ${bufferLen}/${SAMPLE_SIZE}`;
            bufferInfo.innerText = `buffer: ${bufferLen}/${SAMPLE_SIZE}`;

            if (percentage !== undefined && percentage >= 13.0 && isAnalyzing) {
                log(`🔔 SIGNAL: Digit ${hotDigit} hit ${percentage.toFixed(1)}% · 2‑tick match opportunity`, 'success');
            }
        }

        function resetUI() {
            targetDigitEl.innerText = '—';
            accuracyScoreEl.innerText = '—%';
            hitRateDisplay.innerText = 'Hit rate: —';
            sampleStatus.innerText = `buffer: ${recentDigits.length}/${SAMPLE_SIZE}`;
            bufferInfo.innerText = `buffer: ${recentDigits.length}/${SAMPLE_SIZE}`;
            signalDisplay.classList.add('signal-hidden');
        }

        // ----- analysis engine -----
        function analyzeDigits() {
            if (recentDigits.length < SAMPLE_SIZE) {
                updateUI(undefined, undefined, 0);
                return;
            }

            const counts = Array(10).fill(0);
            for (let d of recentDigits) {
                if (d >= 0 && d <= 9) counts[d]++;
            }

            let maxCount = -1;
            let hotDigit = 0;
            for (let i = 0; i < 10; i++) {
                if (counts[i] > maxCount) {
                    maxCount = counts[i];
                    hotDigit = i;
                }
            }
            const percentage = (maxCount / SAMPLE_SIZE) * 100;
            updateUI(hotDigit, percentage, maxCount);
        }

        // ----- test connection with valid symbols -----
        function testSymbol(symbol) {
            // List of known valid symbols from Deriv API
            const validSymbols = [
                'R_10', 'R_25', 'R_50', 'R_75', 'R_100',
                '1HZ10V', '1HZ25V', '1HZ50V', '1HZ75V', '1HZ100V',
                'STEP_50', 'STEP_100', 'STEP_200',
                'CRASH_100', 'BOOM_100'
            ];
            return validSymbols.includes(symbol);
        }

        // ----- WebSocket connection -----
        function connectWebSocket() {
            if (!isAnalyzing) return;
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }

            const symbol = symbolSelect.value;
            
            // Validate symbol
            if (!testSymbol(symbol)) {
                log(`Symbol "${symbol}" may not be valid. Trying anyway...`, 'error');
            }

            try {
                ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
                
                ws.onopen = () => {
                    reconnectAttempts = 0;
                    isSubscribed = false;
                    log(`Connected · subscribing to ${symbol}`, 'success');
                    
                    // First send a ping to establish connection
                    ws.send(JSON.stringify({ ping: 1 }));
                    
                    // Subscribe to ticks
                    const subscribeMsg = {
                        ticks: symbol,
                        subscribe: 1
                    };
                    ws.send(JSON.stringify(subscribeMsg));
                    log(`Subscription request sent for ${symbol}`, 'info');
                    
                    // Also try to get asset index to verify symbol
                    const assetMsg = {
                        asset_index: 1,
                        symbol: symbol
                    };
                    ws.send(JSON.stringify(assetMsg));

                    if (pingTimer) clearInterval(pingTimer);
                    pingTimer = setInterval(() => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ ping: 1 }));
                        }
                    }, 15000);

                    statusBadge.innerText = 'Streaming';
                    statusBadge.className = 'status-badge badge-live';
                    statusText.innerText = `active · ${symbol}`;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                };

                ws.onmessage = (ev) => {
                    try {
                        const data = JSON.parse(ev.data);
                        
                        // Log all messages for debugging (except pong)
                        if (data.msg_type !== 'pong' && data.msg_type !== 'ping') {
                            // Don't spam the log with every tick
                            if (data.msg_type !== 'tick') {
                                log(`Received: ${data.msg_type || 'unknown'}`, 'info');
                            }
                        }

                        // Handle API errors
                        if (data.error) {
                            const errorMsg = data.error.message || 'Unknown error';
                            log(`API error: ${errorMsg}`, 'error');
                            
                            if (errorMsg.includes('invalid') || errorMsg.includes('not found')) {
                                statusBadge.innerText = 'Error';
                                statusBadge.className = 'status-badge badge-error';
                                statusText.innerText = `invalid symbol: ${symbol}`;
                                log(`⚠️ Symbol "${symbol}" is invalid. Please try: R_75, 1HZ75V, etc.`, 'error');
                                
                                // Try alternative format
                                if (symbol === 'R_75') {
                                    log('💡 Try using "1HZ75V" for 1-second volatility 75', 'info');
                                }
                            }
                            return;
                        }

                        // Handle asset index response
                        if (data.msg_type === 'asset_index') {
                            if (data.asset_index) {
                                log(`✅ Symbol "${symbol}" is valid!`, 'success');
                                isSubscribed = true;
                            }
                        }

                        // Handle tick data
                        if (data.msg_type === 'tick' && data.tick && data.tick.quote !== undefined) {
                            lastTickTime = Date.now();
                            const quoteStr = String(data.tick.quote);
                            // Get last digit, handling negative numbers and decimals
                            const cleaned = quoteStr.replace('-', '').replace('.', '');
                            if (cleaned.length > 0) {
                                const lastChar = cleaned.slice(-1);
                                const digit = parseInt(lastChar, 10);
                                if (!isNaN(digit) && digit >= 0 && digit <= 9) {
                                    recentDigits.push(digit);
                                    if (recentDigits.length > SAMPLE_SIZE) {
                                        recentDigits.shift();
                                    }
                                    analyzeDigits();
                                }
                            }
                        }
                    } catch (e) {
                        // Silent fail for parse errors
                    }
                };

                ws.onerror = (err) => {
                    log('WebSocket error occurred', 'error');
                };

                ws.onclose = (e) => {
                    if (pingTimer) clearInterval(pingTimer);
                    if (isAnalyzing) {
                        log(`Connection lost (code: ${e.code}) · reconnecting...`, 'error');
                        statusBadge.innerText = 'Reconnecting';
                        statusBadge.className = 'status-badge';
                        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                            reconnectAttempts++;
                            const delay = Math.min(2000 + (reconnectAttempts * 500), 8000);
                            if (reconnectTimer) clearTimeout(reconnectTimer);
                            reconnectTimer = setTimeout(() => {
                                if (isAnalyzing) connectWebSocket();
                            }, delay);
                        } else {
                            log('Max reconnection attempts reached. Please restart.', 'error');
                            stopAnalysis();
                        }
                    } else {
                        log('Connection closed.');
