<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Match Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            color: #3b82f6;
            font-size: 22px;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .header p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
        }
        .card {
            background: #131b2e;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #1e293b;
        }
        .card-title {
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        select {
            width: 100%;
            padding: 12px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            font-weight: 500;
        }
        select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .mode-selector {
            display: flex;
            gap: 12px;
            margin: 12px 0 16px 0;
        }
        .mode-selector label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 8px;
            background: #1e293b;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .mode-selector label.active {
            border-color: #8b5cf6;
            background: #2e1065;
            color: #c4b5fd;
        }
        .mode-selector label input[type="radio"] {
            accent-color: #8b5cf6;
            width: 16px;
            height: 16px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary {
            background: #10b981;
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: #059669;
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover:not(:disabled) {
            background: #dc2626;
        }
        .btn-purple {
            background: #8b5cf6;
            color: #fff;
        }
        .btn-purple:hover:not(:disabled) {
            background: #7c3aed;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-idle {
            background: #475569;
            color: #f1f5f9;
        }
        .badge-running {
            background: #10b981;
            color: #fff;
        }
        .badge-connecting {
            background: #f59e0b;
            color: #000;
        }
        .badge-sim {
            background: #8b5cf6;
            color: #fff;
        }
        .badge-error {
            background: #ef4444;
            color: #fff;
        }
        .status-text {
            color: #94a3b8;
            font-size: 13px;
        }
        .signal-box {
            background: #0f1a2f;
            border-left: 4px solid #3b82f6;
            padding: 16px;
            border-radius: 10px;
            margin-top: 12px;
            display: none;
        }
        .signal-box.show {
            display: block;
        }
        .signal-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }
        .digit-display {
            font-size: 32px;
            font-weight: 700;
            color: #10b981;
            background: #0b1a1a;
            padding: 0 16px;
            border-radius: 40px;
            border: 1px solid #1e3a3a;
            min-width: 60px;
            text-align: center;
        }
        .confidence {
            font-size: 22px;
            color: #fbbf24;
            font-weight: 700;
        }
        .hit-rate {
            color: #94a3b8;
            font-size: 14px;
        }
        .log-box {
            background: #070a12;
            border-radius: 10px;
            padding: 12px 14px;
            height: 150px;
            overflow-y: auto;
            font-family: 'Menlo', monospace;
            font-size: 11px;
            line-height: 1.8;
            border: 1px solid #1e293b;
            margin-top: 12px;
        }
        .log-box::-webkit-scrollbar {
            width: 4px;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .log-info {
            color: #60a5fa;
        }
        .log-success {
            color: #34d399;
        }
        .log-error {
            color: #f87171;
        }
        .log-warning {
            color: #fbbf24;
        }
        .log-sim {
            color: #a78bfa;
        }
        .log-signal {
            color: #f472b6;
            font-weight: bold;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .text-muted {
            color: #94a3b8;
            font-size: 13px;
        }
        .flex {
            display: flex;
            align-items: center;
        }
        .gap-2 {
            gap: 8px;
        }
        .gap-4 {
            gap: 16px;
        }
        .justify-between {
            justify-content: space-between;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .w-full {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 DIGIT MATCH</h1>
            <p>Real-time digit prediction for volatility trading</p>
        </div>

        <!-- Controls -->
        <div class="card">
            <div class="card-title">📊 Select Market</div>
            <select id="symbolSelect">
                <optgroup label="1-Second Volatility">
                    <option value="1HZ10V">Volatility 10 (1s)</option>
                    <option value="1HZ25V">Volatility 25 (1s)</option>
                    <option value="1HZ50V">Volatility 50 (1s)</option>
                    <option value="1HZ75V" selected>Volatility 75 (1s) ⭐</option>
                    <option value="1HZ100V">Volatility 100 (1s)</option>
                </optgroup>
                <optgroup label="Standard Volatility">
                    <option value="R_10">Volatility 10</option>
                    <option value="R_25">Volatility 25</option>
                    <option value="R_50">Volatility 50</option>
                    <option value="R_75">Volatility 75</option>
                    <option value="R_100">Volatility 100</option>
                </optgroup>
            </select>

            <div class="mode-selector">
                <label id="simLabel" class="active">
                    <input type="radio" name="mode" value="sim" checked> 🎮 Simulation
                </label>
                <label id="realLabel">
                    <input type="radio" name="mode" value="real"> 🌐 Live Data
                </label>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="startBtn">▶ Start</button>
                <button class="btn btn-danger" id="stopBtn" disabled>⏹ Stop</button>
            </div>
        </div>

        <!-- Status & Signals -->
        <div class="card">
            <div class="status-bar">
                <div class="flex gap-2">
                    <span class="badge badge-idle" id="statusBadge">Idle</span>
                    <span class="status-text" id="statusText">Ready</span>
                </div>
                <span class="text-muted" id="bufferDisplay">buffer: 0/100</span>
            </div>

            <div class="signal-box" id="signalBox">
                <div class="signal-row">
                    <span>🎯 Predicted Digit</span>
                    <span class="digit-display" id="digitDisplay">—</span>
                </div>
                <div class="signal-row" style="margin-top: 6px;">
                    <span>📈 Confidence</span>
                    <span class="confidence" id="confidenceDisplay">—%</span>
                </div>
                <div class="signal-row" style="margin-top: 6px; border-top: 1px solid #1e293b; padding-top: 8px;">
                    <span class="hit-rate" id="hitRateDisplay">Hit rate: —</span>
                    <span class="text-muted" id="sampleDisplay">buffer: 0/100</span>
                </div>
            </div>

            <div class="log-box" id="logBox">
                <div class="log-info">[System] Welcome to Digit Match</div>
                <div class="log-info">[System] Click "Start" to begin analysis</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // COMPLETE REWRITE - CLEAN & RELIABLE
        // ============================================

        (function() {
            'use strict';

            // --- DOM Elements ---
            const logBox = document.getElementById('logBox');
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const signalBox = document.getElementById('signalBox');
            const digitDisplay = document.getElementById('digitDisplay');
            const confidenceDisplay = document.getElementById('confidenceDisplay');
            const hitRateDisplay = document.getElementById('hitRateDisplay');
            const sampleDisplay = document.getElementById('sampleDisplay');
            const bufferDisplay = document.getElementById('bufferDisplay');
            const symbolSelect = document.getElementById('symbolSelect');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const simLabel = document.getElementById('simLabel');
            const realLabel = document.getElementById('realLabel');
            const modeRadios = document.querySelectorAll('input[name="mode"]');

            // --- State ---
            let digits = [];
            const SAMPLE_SIZE = 100;
            let isRunning = false;
            let isSimulating = false;
            let simTimer = null;
            let ws = null;
            let wsPing = null;
            let tickCount = 0;

            // --- Logging ---
            function log(msg, type = 'info') {
                const time = new Date().toLocaleTimeString('en-US', { hour12: false });
                const classes = {
                    info: 'log-info',
                    success: 'log-success',
                    error: 'log-error',
                    warning: 'log-warning',
                    sim: 'log-sim',
                    signal: 'log-signal'
                };
                const cls = classes[type] || 'log-info';
                logBox.innerHTML += `<div class="${cls}">[${time}] ${msg}</div>`;
                logBox.scrollTop = logBox.scrollHeight;
                // Keep log manageable
                if (logBox.children.length > 120) {
                    const items = logBox.innerHTML.split('</div>');
                    logBox.innerHTML = items.slice(-90).join('</div>');
                }
            }

            // --- Status Updates ---
            function setStatus(state, text) {
                const badges = {
                    idle: 'badge-idle',
                    running: 'badge-running',
                    connecting: 'badge-connecting',
                    sim: 'badge-sim',
                    error: 'badge-error'
                };
                const labels = {
                    idle: 'Idle',
                    running: 'Running',
                    connecting: 'Connecting',
                    sim: 'Simulating',
                    error: 'Error'
                };
                statusBadge.textContent = labels[state] || state;
                statusBadge.className = `badge ${badges[state] || 'badge-idle'}`;
                statusText.textContent = text || '';
            }

            // --- Signal Display ---
            function updateSignal(digit, percentage) {
                signalBox.classList.add('show');
                digitDisplay.textContent = digit !== undefined ? digit : '—';
                
                if (percentage !== undefined) {
                    const conf = Math.min(96, Math.max(48, 52 + ((percentage - 10) * 3.2)));
                    confidenceDisplay.textContent = conf.toFixed(1) + '%';
                    hitRateDisplay.textContent = `Hit rate: ${percentage.toFixed(1)}%`;
                } else {
                    confidenceDisplay.textContent = '—%';
                    hitRateDisplay.textContent = 'Hit rate: —';
                }
                
                const len = digits.length;
                sampleDisplay.textContent = `buffer: ${len}/${SAMPLE_SIZE}`;
                bufferDisplay.textContent = `buffer: ${len}/${SAMPLE_SIZE}`;

                if (percentage !== undefined && percentage >= 13.0 && isRunning) {
                    log(`🔔 SIGNAL: Digit ${digit} at ${percentage.toFixed(1)}% — 2-tick match opportunity!`, 'signal');
                }
            }

            function resetSignal() {
                signalBox.classList.remove('show');
                digitDisplay.textContent = '—';
                confidenceDisplay.textContent = '—%';
                hitRateDisplay.textContent = 'Hit rate: —';
                const len = digits.length;
                sampleDisplay.textContent = `buffer: ${len}/${SAMPLE_SIZE}`;
                bufferDisplay.textContent = `buffer: ${len}/${SAMPLE_SIZE}`;
            }

            // --- Analysis Engine ---
            function analyze() {
                if (digits.length < SAMPLE_SIZE) {
                    updateSignal(undefined, undefined);
                    return;
                }

                const counts = Array(10).fill(0);
                for (let d of digits) {
                    if (d >= 0 && d <= 9) counts[d]++;
                }

                let maxCount = -1;
                let hotDigit = 0;
                for (let i = 0; i < 10; i++) {
                    if (counts[i] > maxCount) {
                        maxCount = counts[i];
                        hotDigit = i;
                    }
                }
                const percentage = (maxCount / SAMPLE_SIZE) * 100;
                updateSignal(hotDigit, percentage);
            }

            // --- Add a digit ---
            function addDigit(digit) {
                if (!isRunning) return;
                digits.push(digit);
                if (digits.length > SAMPLE_SIZE) {
                    digits.shift();
                }
                analyze();
            }

            // --- SIMULATION ---
            function runSimulation() {
                if (isRunning) {
                    log('Already running. Stop first.', 'warning');
                    return;
                }

                // Clean up
                stopAll();

                isRunning = true;
                isSimulating = true;
                digits = [];
                tickCount = 0;
                resetSignal();

                setStatus('sim', 'generating data...');
                log('🎮 Starting simulation...', 'sim');
                log('📊 Generating synthetic market ticks', 'sim');

                startBtn.disabled = true;
                stopBtn.disabled = false;

                let price = 10000 + Math.random() * 5000;
                let count = 0;

                simTimer = setInterval(() => {
                    if (!isRunning || !isSimulating) {
                        clearInterval(simTimer);
                        return;
                    }

                    // Generate realistic price movement
                    const vol = 0.001 + Math.random() * 0.005;
                    const dir = Math.random() > 0.5 ? 1 : -1;
                    const move = (Math.random() * 2 + 0.5) * vol * price * dir;
                    price = Math.max(1000, price + move);
                    price += (Math.random() - 0.5) * 2;
                    
                    // Extract last digit
                    const str = price.toFixed(2);
                    const clean = str.replace('-', '').replace('.', '');
                    if (clean.length > 0) {
                        const digit = parseInt(clean.slice(-1), 10);
                        if (!isNaN(digit) && digit >= 0 && digit <= 9) {
                            addDigit(digit);
                            count++;
                            if (count % 20 === 0) {
                                log(`📊 ${count} simulated ticks`, 'sim');
                            }
                        }
                    }
                }, 250);

                log('✅ Simulation running! Watch predictions update.', 'sim');
            }

            // --- REAL CONNECTION ---
            function runReal() {
                if (isRunning) {
                    log('Already running. Stop first.', 'warning');
                    return;
                }

                stopAll();

                const symbol = symbolSelect.value;
                isRunning = true;
                isSimulating = false;
                digits = [];
                tickCount = 0;
                resetSignal();

                setStatus('connecting', `connecting to ${symbol}...`);
                log(`🌐 Connecting to ${symbol}...`, 'info');

                startBtn.disabled = true;
                stopBtn.disabled = false;

                try {
                    ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

                    let timeout = setTimeout(() => {
                        if (ws && ws.readyState !== WebSocket.OPEN) {
                            log('❌ Connection timeout', 'error');
                            setStatus('error', 'timeout');
                            stopAll();
                            startBtn.disabled = false;
                            stopBtn.disabled = true;
                        }
                    },
